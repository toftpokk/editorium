[package]
name = "editorium"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.7"
iced = { version = "0.13.1", features = ["highlighter", "image", "tokio"] }
iced_aw = "0.12.2"
log = "0.4.27"
rfd = "0.15.3"
clap = { version = "4.5.37", features = ["derive"] }
cosmic-text = { version = "0.14.2", features = ["syntect"] }
syntect = "5.2.0"
lsp-types = "0.97.0"
smol = "2.0.2"
blocking = "1.6.1"
serde = "1.0.219"
serde_json = "1.0.140"
url = "2.5.4"
